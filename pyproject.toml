[project]
name = "klimenko_nlp_labs"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "ipykernel",
    "jupyter",
    "matplotlib",
    "nltk",
    "numpy",
    "pandas",
    "pymorphy3",
    "scikit-learn",
    "seaborn",
    "spacy",
    "wordcloud",
]

[tool.ruff]
line-length = 79

[tool.ruff.format]
indent-style = "space"
quote-style = "double"